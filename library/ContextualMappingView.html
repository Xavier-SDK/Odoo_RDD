<!DOCTYPE html>
<html>

<head>
    <base target="_top">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body {
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            padding: 0;
            margin: 0;
            font-size: 14px;
            color: #202124;
            background-color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        #main-content {
            display: flex;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            font-size: 13px;
            color: #5f6368;
            letter-spacing: 0.2px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .refresh-link {
            color: #1a73e8;
            cursor: pointer;
            font-size: 11px;
            text-decoration: none;
        }

        .refresh-link:hover {
            text-decoration: underline;
        }

        .refresh-link i {
            margin-right: 3px;
        }

        select {
            width: 100%;
            padding: 10px 12px;
            box-sizing: border-box;
            border: 1px solid #dadce0;
            border-radius: 4px;
            font-size: 14px;
            color: #202124;
            background-color: #fff;
        }

        select:disabled {
            background-color: #f1f3f4;
            color: #80868b;
        }

        button {
            background-color: #1a73e8;
            color: #fff;
            border: none;
            padding: 10px 24px;
            cursor: pointer;
            width: 100%;
            margin-top: 8px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3);
        }

        button:hover {
            background-color: #1557b0;
        }

        button:disabled {
            background-color: #f1f3f4;
            color: #80868b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .test-button {
            background-color: #1a73e8;
            margin-top: 20px;
        }

        .save-button {
            background-color: #188038;
            margin-top: 10px;
        }

        .save-button:hover {
            background-color: #137333;
        }

        #columns-wrapper {
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: hidden;
            margin-top: 10px;
            margin-bottom: 10px;
            border: 1px solid #f0f0f0;
            border-radius: 4px;
            padding: 10px;
        }

        .column-row {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid #f1f3f4;
        }

        .column-row:last-child {
            border-bottom: none;
        }

        .column-name {
            font-size: 13px;
            font-weight: 500;
            color: #3c4043;
            margin-bottom: 6px;
        }

        .column-row.has-error select {
            border: 1px solid #d93025;
            background-color: #fce8e6;
        }

        .column-row.has-error .column-name {
            color: #d93025;
        }

        .column-row.is-valid select {
            border: 1px solid #188038;
        }

        .error-details {
            font-size: 12px;
            color: #d93025;
            margin-top: 6px;
            padding-left: 20px;
        }

        #status {
            margin-top: 12px;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            text-align: center;
            display: none;
        }

        #status.success {
            background-color: #e6f4ea;
            color: #137333;
        }

        #status.error {
            background-color: #fce8e6;
            color: #c5221f;
        }

        #status.info {
            background-color: #e8f0fe;
            color: #1a73e8;
        }

        .error-message {
            background-color: #fce8e6;
            color: #c5221f;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 16px;
            display: none;
        }

        .no-data {
            color: #5f6368;
            font-style: italic;
            text-align: center;
            padding: 20px;
        }

        .loader {
            border: 2px solid #f3f3f3;
            border-radius: 50%;
            border-top: 2px solid #3498db;
            width: 12px;
            height: 12px;
            -webkit-animation: spin 2s linear infinite;
            animation: spin 2s linear infinite;
            display: inline-block;
            margin-left: 5px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div id="main-content">

        <div id="error-container" class="error-message"></div>

        <!-- Choix Onglet -->
        <div class="form-group">
            <label for="sheet-select">Onglet source :</label>
            <select id="sheet-select" onchange="onSheetChange()">
                <option value="">Chargement...</option>
            </select>
        </div>

        <!-- Choix Modèle -->
        <div class="form-group">
            <label for="model-select">
                Modèle Odoo cible :
                <a class="refresh-link" onclick="loadModels(true)" title="Forcer le rechargement depuis Odoo">
                    <i class="fa fa-refresh"></i> Actualiser
                </a>
            </label>
            <select id="model-select" onchange="onModelChange()" disabled>
                <option value="">Chargement...</option>
            </select>
        </div>

        <!-- Zone de mapping -->
        <div id="columns-wrapper">
            <div class="no-data" id="placeholder-msg">Sélectionnez un modèle pour commencer.</div>
            <div id="column-mappings"></div>
        </div>

        <!-- Actions -->
        <div id="actions-area">
            <button class="test-button" onclick="testMappings()" id="test-btn" disabled>
                <i class="fa fa-stethoscope"></i> Tester les données
            </button>

            <button class="save-button" onclick="saveAllMappings()" id="save-btn" disabled>
                <i class="fa fa-save"></i> Enregistrer
            </button>

            <div id="status"></div>
        </div>

    </div>

    <script>
        // État global
        var state = {
            sheetName: null,
            currentModel: null,
            columns: [],
            availableModels: [],
            fields: [],
            existingMappings: {}
        };

        // --- Cycle de vie ---

        window.onload = function () {
            startLoadingSequence();
        };

        function startLoadingSequence(sheetName) {
            showStatus('Chargement onglet...', 'info');
            google.script.run
                .withSuccessHandler(handleInitialData)
                .getInitialMappingData(sheetName);
        }

        function handleInitialData(data) {
            state.sheetName = data.sheetName;
            state.currentModel = data.currentModel;
            state.columns = data.columns;
            state.existingMappings = data.existingMappings || {};

            console.log('Mappings existants chargés:', state.existingMappings);
            console.log('Colonnes:', state.columns);

            // Remplir liste onglets
            var sheetSelect = document.getElementById('sheet-select');
            sheetSelect.innerHTML = '';
            data.availableSheets.forEach(function (s) {
                var opt = document.createElement('option');
                opt.value = s;
                opt.textContent = s;
                if (s === data.sheetName) opt.selected = true;
                sheetSelect.appendChild(opt);
            });

            loadModels(false);
        }

        function loadModels(forceRefresh) {
            var modelSelect = document.getElementById('model-select');
            modelSelect.disabled = true;
            modelSelect.innerHTML = '<option>Chargement des modèles...</option>';
            if (forceRefresh) showStatus('Actualisation depuis Odoo...', 'info');

            google.script.run
                .withSuccessHandler(function (result) {
                    handleModelsList(result, forceRefresh);
                })
                .withFailureHandler(function (err) {
                    showError('Erreur chargement modèles: ' + err.message);
                    modelSelect.innerHTML = '<option value="">Erreur</option>';
                })
                .getContextualModels(forceRefresh);
        }

        function handleModelsList(result, forceRefresh) {
            state.availableModels = result.models;

            var modelSelect = document.getElementById('model-select');
            modelSelect.innerHTML = '<option value="">-- Sélectionner un modèle --</option>';

            result.models.forEach(function (m) {
                var opt = document.createElement('option');
                opt.value = m.model;
                opt.textContent = m.model + ' (' + m.name + ')';
                if (state.currentModel && m.model === state.currentModel) {
                    opt.selected = true;
                }
                modelSelect.appendChild(opt);
            });

            modelSelect.disabled = false;

            if (result.source === 'cache') {
                console.log('Modèles chargés depuis le cache');
            } else {
                hideStatus();
            }

            if (state.currentModel) {
                loadFields(state.currentModel, forceRefresh);
            } else {
                hideStatus();
                document.getElementById('placeholder-msg').textContent = "Sélectionnez un modèle pour commencer.";
            }
        }

        function loadFields(modelName, forceRefresh) {
            showStatus('Chargement champs...', 'info');
            document.getElementById('save-btn').disabled = true;

            google.script.run
                .withSuccessHandler(function (fields) {
                    state.fields = fields;
                    renderColumnMappings();
                    hideStatus();
                    document.getElementById('save-btn').disabled = false;
                    document.getElementById('test-btn').disabled = false;
                })
                .getModelFields(modelName, forceRefresh);

            // IMPORTANT: Refresh cache en arrière-plan
            if (!forceRefresh) {
                google.script.run
                    .withSuccessHandler(function () {
                        console.log('Cache mis à jour en arrière-plan');
                    })
                    .getModelFields(modelName, true);
            }
        }

        // --- UI Interactions ---

        function onSheetChange() {
            var sheetName = document.getElementById('sheet-select').value;
            if (sheetName) {
                startLoadingSequence(sheetName);
            }
        }

        function onModelChange() {
            var modelName = document.getElementById('model-select').value;
            if (modelName) {
                state.currentModel = modelName;
                loadFields(modelName, false);
            } else {
                state.currentModel = null;
                document.getElementById('column-mappings').innerHTML = '';
                document.getElementById('save-btn').disabled = true;
            }
        }

        function renderColumnMappings() {
            var container = document.getElementById('column-mappings');
            container.innerHTML = '';
            document.getElementById('placeholder-msg').style.display = 'none';

            if (state.columns.length === 0) {
                container.innerHTML = '<div class="no-data">Aucune colonne trouvée</div>';
                return;
            }

            state.columns.forEach(function (colName) {
                var row = document.createElement('div');
                row.className = 'column-row';

                var label = document.createElement('div');
                label.className = 'column-name';
                label.textContent = colName;
                row.appendChild(label);

                var select = document.createElement('select');
                select.className = 'field-select';
                select.setAttribute('data-column', colName);

                var empty = document.createElement('option');
                empty.value = '';
                empty.textContent = '-- Ne pas importer --';
                select.appendChild(empty);

                // PRIORITÉ 1: Mapping existant
                var selectedFieldId = state.existingMappings[colName];

                console.log('Colonne:', colName, 'Mapping existant:', selectedFieldId);

                // PRIORITÉ 2: Suggestion intelligente si pas de mapping existant
                if (!selectedFieldId) {
                    selectedFieldId = findBestMatch(colName, state.fields);
                    console.log('Colonne:', colName, 'Suggestion:', selectedFieldId);
                }

                state.fields.forEach(function (f) {
                    var opt = document.createElement('option');
                    opt.value = f.id;
                    opt.textContent = f.text;
                    if (f.id === selectedFieldId) opt.selected = true;
                    select.appendChild(opt);
                });

                row.appendChild(select);
                container.appendChild(row);
            });
        }

        // Matching intelligent
        function findBestMatch(colName, fields) {
            if (!colName) return null;
            var normCol = normalize(colName);

            var common = {
                'nom': 'name', 'name': 'name', 'email': 'email', 'telephone': 'phone',
                'phone': 'phone', 'tel': 'phone', 'mobile': 'mobile', 'ville': 'city',
                'city': 'city', 'cp': 'zip', 'zip': 'zip', 'pays': 'country_id'
            };

            if (common[normCol]) {
                var m = fields.find(f => f.id === common[normCol]);
                if (m) return m.id;
            }

            var exactStr = fields.find(f => f.string && normalize(f.string) === normCol);
            if (exactStr) return exactStr.id;

            var exactId = fields.find(f => normalize(f.id) === normCol);
            if (exactId) return exactId.id;

            return null;
        }

        function normalize(s) {
            return s.toLowerCase().replace(/[^a-z0-9]/g, '');
        }

        // --- Actions ---

        function saveAllMappings() {
            var model = state.currentModel;
            var sheet = state.sheetName;
            if (!model) return;

            var mappings = {};
            document.querySelectorAll('.field-select').forEach(function (sel) {
                if (sel.value) mappings[sel.getAttribute('data-column')] = sel.value;
            });

            showStatus('Enregistrement...', 'info');
            document.getElementById('save-btn').disabled = true;

            google.script.run
                .withSuccessHandler(function (res) {
                    if (res.success) {
                        showStatus('✅ ' + res.message, 'success');
                        // Mettre à jour l'état local
                        state.existingMappings = mappings;
                    }
                    else showStatus('❌ ' + res.message, 'error');
                    document.getElementById('save-btn').disabled = false;
                })
                .saveContextualMapping(sheet, model, mappings);
        }

        function testMappings() {
            var model = state.currentModel;
            var sheet = state.sheetName;
            var mappings = {};
            document.querySelectorAll('.field-select').forEach(function (sel) {
                if (sel.value) mappings[sel.getAttribute('data-column')] = sel.value;
            });

            if (Object.keys(mappings).length === 0) {
                showError("Rien à tester");
                return;
            }

            showStatus('Test en cours...', 'info');
            document.getElementById('test-btn').disabled = true;

            document.querySelectorAll('.column-row').forEach(r => {
                r.classList.remove('has-error', 'is-valid');
                var ed = r.querySelector('.error-details');
                if (ed) ed.remove();
            });

            google.script.run
                .withSuccessHandler(function (res) {
                    document.getElementById('test-btn').disabled = false;
                    if (!res.success) { showError(res.message); return; }

                    if (res.errorCount === 0) {
                        showStatus("✅ Données valides", "success");
                        document.querySelectorAll('.field-select').forEach(s => {
                            if (s.value) s.closest('.column-row').classList.add('is-valid');
                        });
                    } else {
                        showStatus("⚠️ " + res.errorCount + " erreurs trouvées", "error");
                        for (var col in res.errors) {
                            if (res.errors[col].length > 0) {
                                var sel = document.querySelector('.field-select[data-column="' + col + '"]');
                                if (sel) {
                                    var row = sel.closest('.column-row');
                                    row.classList.add('has-error');
                                    var div = document.createElement('div');
                                    div.className = 'error-details';
                                    div.innerHTML = res.errors[col].slice(0, 3).join('<br>');
                                    row.appendChild(div);
                                }
                            }
                        }
                    }
                })
                .testMappingData(sheet, model, mappings);
        }

        // --- Utils ---
        function showStatus(msg, type) {
            var s = document.getElementById('status');
            s.textContent = msg;
            s.className = type || 'info';
            s.style.display = 'block';
        }
        function hideStatus() {
            document.getElementById('status').style.display = 'none';
        }
        function showError(msg) {
            var c = document.getElementById('error-container');
            c.textContent = msg;
            c.style.display = 'block';
            setTimeout(function () { c.style.display = 'none'; }, 5000);
        }
    </script>
</body>

</html>
